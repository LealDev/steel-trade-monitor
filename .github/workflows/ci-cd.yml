name: CI/CD

# Fluxo de branches: develop é o dia a dia (só CI); main é produção
# (CI + deploy automático no Contabo quando os testes passam).
on:
  push:
    branches: [main, develop]
  pull_request:

# GITHUB_TOKEN só de leitura: nenhum job escreve no repositório
permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/steel-trade-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers usa o Docker do próprio runner
      - name: Testes (unitários + integração)
        run: ./mvnw --batch-mode test

  frontend:
    name: Frontend (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/steel-trade-monitor-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/steel-trade-monitor-web/package-lock.json
      - run: npm ci
      - name: Testes
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build de produção
        run: npx ng build

  deploy:
    name: Deploy (Contabo)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/steel-trade-monitor-web/package-lock.json

      - name: Build do frontend
        working-directory: Frontend/steel-trade-monitor-web
        run: npm ci && npx ng build

      - name: Configurar SSH (chave dedicada + host key fixado)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "167.86.66.58 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH9x3WL0UFhEN/lCXkJ6101S2btwdiwPbeMEJPYYmoYP" >> ~/.ssh/known_hosts

      - name: Deploy do backend (rsync + rebuild na VPS)
        run: |
          rsync -a --delete Backend/steel-trade-api/ emanuel@167.86.66.58:/opt/stack/apps/steel-trade/api/
          ssh emanuel@167.86.66.58 "cd /opt/stack && docker compose up -d --build steel-api"

      - name: Deploy do frontend (estáticos para o Caddy)
        run: rsync -a --delete Frontend/steel-trade-monitor-web/dist/steel-trade-monitor-web/browser/ emanuel@167.86.66.58:/opt/stack/caddy/site/steel/

      - name: Health check
        run: |
          # a API leva ~1 min para subir após o rebuild; tenta por até 2 min
          for i in $(seq 1 24); do
            if curl -fsS https://steel.lealdev.com.br/api/actuator/health; then
              curl -fsS -o /dev/null https://steel.lealdev.com.br/
              echo; echo "deploy saudável"
              exit 0
            fi
            sleep 5
          done
          echo "API não respondeu em 2 minutos" >&2
          exit 1
