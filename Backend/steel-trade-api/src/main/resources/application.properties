spring.application.name=steel-trade-api
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/steel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:steel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:steel}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fonte Comex Stat (contrato validado em 2026-09; rate limit ~1 req/10s)
comexstat.base-url=https://api-comexstat.mdic.gov.br
comexstat.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) SteelTradeMonitor/0.1 (+https://github.com/LealDev/steel-trade-monitor)
comexstat.meses-janela-movel=6
# Job agendado desligado em dev: a coleta manual (POST /v1/ingestion/comexstat/runs) evita gastar cota
comexstat.agendamento-habilitado=false
comexstat.cron=0 0 3 * * *

# Token do disparo manual de ingestão (header X-Ingestion-Token).
# Vazio = rota aberta (dev). Em produção, definir APP_INGESTION_TOKEN.
app.ingestion.token=${APP_INGESTION_TOKEN:}
